  <!--
    ── Security HTTP-equivalent headers ───────────────────────────────────────
    CSP:  Only allow resources from self + known CDNs (Google Fonts, Supabase,

          <iframe> on any origin (clickjacking defence).
    X-Frame-Options: Redundant DENY for older browsers that ignore CSP.
  -->
  <meta http-equiv="Content-Security-Policy"
    content="
      default-src   'self';
      script-src    'self' 'unsafe-inline' 'unsafe-eval';
      style-src     'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src      'self' https://fonts.gstatic.com data:;
      img-src       'self' data: blob: https:;
      connect-src   'self' https://*.supabase.co wss://*.supabase.co https://fonts.googleapis.com;
      media-src     'none';
      object-src    'none';
      worker-src    blob:;
      frame-src     'none';
      frame-ancestors 'none';
      base-uri      'self';
      form-action   'self';
    "
  />

      document.addEventListener('keydown', function (e) {
        var k = (e.key || '').toUpperCase();
